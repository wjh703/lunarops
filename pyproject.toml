[build-system]
requires = [
    "cython>=3.2.8",
    "numpy>=2.5.1",
    "setuptools>=83.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "lunarops"
version = "0.1.0"
description = "GROOPS-inspired Lunar Laser Ranging processing system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "calcephpy>=5.0.0",
    "numpy>=2.5.1",
    "pyerfa>=2.0.1.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.4",
]


[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov>=7.0.0"]
mpi = ["mpi4py>=4.1.2"]
plot = ["matplotlib>=3.11.1"]
build = [
    "build>=1.3.0",
    "cython>=3.2.8",
    "setuptools>=83.0.0",
]

[project.scripts]
lunarops = "lunarops.cli:main"

[dependency-groups]
dev = ["build>=1.3.0"]
typecheck = [
    "matplotlib>=3.11.1",
    "mypy>=1.18.2",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
files = ["lunarops", "scripts", "tests"]
exclude = ["^build/", "^dist/"]
check_untyped_defs = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "calcephpy",
    "calcephpy.*",
    "erfa",
    "erfa.*",
    "mpi4py",
    "mpi4py.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lunarops", "lunarops.*"]
check_untyped_defs = true
