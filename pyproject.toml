[build-system]
requires = [
    "cython>=3.2.8",
    "numpy>=2.5.1",
    "setuptools>=83.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "lunarops"
version = "0.1.0"
description = "Lunar Laser Ranging processing: observation modelling, parameter estimation, prediction and lunar orbit/rotation propagation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "pyerfa>=2.0.1.5",
    "pyyaml>=6.0.3",
]


[project.optional-dependencies]
dynamics = ["scipy>=1.17"]
test = ["pytest>=9.1.1", "pytest-cov>=7.0.0"]
mpi = ["mpi4py>=4.1.2"]
plot = ["matplotlib>=3.11.1"]
build = [
    "build>=1.3.0",
    "cython>=3.2.8",
    "setuptools>=83.0.0",
]

[project.scripts]
lunarops = "lunarops.cli:main"

[dependency-groups]
dev = ["build>=1.3.0", "ruff>=0.16.7"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
typecheck = [
    "matplotlib>=3.11.1",
    "mypy>=1.18.2",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "mpi: launches mpirun subprocesses; skipped without an MPI launcher and mpi4py",
    "requires_data: needs local scientific data outside the repository; skipped when absent",
    "slow: integrates long arcs or many steps (more than about half a second)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["D"]
# Constructor arguments are documented in the class docstring; dunder methods need none.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"setup.py" = ["D"]

[tool.mypy]
files = ["lunarops", "scripts", "tests"]
exclude = ["^build/", "^dist/"]
check_untyped_defs = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "erfa",
    "erfa.*",
    "mpi4py",
    "mpi4py.*",
    "scipy",
    "scipy.*",
    "pyshtools",
    "pyshtools.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lunarops", "lunarops.*"]
check_untyped_defs = true
