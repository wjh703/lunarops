# yaml-language-server: $schema=lunarops.schema.json
# Compute LLR observed-minus-computed (O-C) residuals with INPOP21a.
#
# The run builds a merged Earth orientation file, converts the input normal
# points to the native normal-point format, writes the station and reflector
# catalogs, and evaluates the full observation model for every normal point.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_oc_residuals.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate normal points):
#   mpirun -n 16 python -m lunarops run configs/lunarops_oc_residuals.yml --mpi
#   # or, inside a Slurm allocation:
#   srun python -m lunarops run configs/lunarops_oc_residuals.yml --mpi
# Under MPI the only per-program option is mpi.chunksize.
#
# Edit before running:
#   dataDir    directory holding kernels/inpop21a, auxiliary/ and polac/
#   outputDir  directory for all products (relative to the working directory)
#   NormalPointsConvert.inputFilesNormalPoints  the CRD, MINI or native
#              normal-point files to process
#   LlrResiduals.outputFileObservationResults   the residual table name
# Earth rotation and time transforms use the merged EOP file written below.

variables:
  dataDir: ~/deploy_bundle/data
  outputDir: ./output

models:
  ephemerides:
    type: chebyshev
    # The BSP position and BPC lunar-orientation kernels in this directory are read directly.
    directory: "{dataDir}/kernels/inpop21a"
    # INPOP lunar coordinates already use their native relativistic scale
    # (alreadyScaled); DE kernels use tdbCompatibleLunarSurface.
    lunarRelativisticScaleConvention: alreadyScaled
    # Longitude-libration correction in the lunar PA -> LCRS orientation:
    # inpop21a or none.
    longitudeLibrationCorrection: inpop21a

  earthRotation:
    type: file
    file: "{outputDir}/eop_merged.txt"

  # Tropospheric delay: mendesPavlis (Mendes & Pavlis 2004) or none.
  troposphere: {type: mendesPavlis}
  # Relativistic (Shapiro) delay per IERS Conventions 2010, or none.
  relativity: {type: iersShapiro}
  # Station displacements per IERS Conventions 2010; remove an entry to
  # switch that effect off.
  stationDisplacement:
    - type: iers2010SolidEarthTide
    - type: iers2010PoleTide
    - type: iers2010OceanPoleTide
      coefficientFile: "{dataDir}/auxiliary/opoleloadcoefcmcor.txt"
    - type: iers2010OceanTidalLoading
      # Onsala BLQ ocean-loading coefficients; model names the tide model
      # in the BLQ header. For FES2014b, use fes2014b.txt with model: FES2014b.
      coefficientFile: "{dataDir}/auxiliary/fes2022b.txt"
      model: FES2022b

  reflectorDisplacement: {type: lunarSolidTide}
  # Additive station range biases applied in the forward model:
  #   inpop21a  built-in INPOP21a station/interval bias table
  #   table     user-supplied biases (file: or inline biases:)
  #   none      raw model residuals without range-bias correction
  rangeBias:
    type: inpop21a

programs:
  - program: IersC04EarthOrientationParameter
    inputFileC04: "{dataDir}/auxiliary/eopc04.1962-now.txt"
    outputFileEarthOrientationParameter: "{outputDir}/eop_c04.txt"
  - program: IersRapidEarthOrientationParameter
    inputFileFinals2000A: "{dataDir}/auxiliary/finals2000A.all"
    outputFileEarthOrientationParameter: "{outputDir}/eop_rapid.txt"
  - program: EarthOrientationParameterMerge
    inputFileC04EarthOrientationParameter: "{outputDir}/eop_c04.txt"
    inputFileRapidEarthOrientationParameter: "{outputDir}/eop_rapid.txt"
    outputFileEarthOrientationParameter: "{outputDir}/eop_merged.txt"
  # Convert CRD, MINI or native normal points into one native file; all
  # later programs read only the native format.
  - program: NormalPointsConvert
    # CRD sigma source: binRmsAsSigma (use the record-11 bin RMS) or fixed
    # (use crdUncertaintyTwoWayS, seconds). Check that it matches the
    # station's precision model.
    crdUncertaintyPolicy: binRmsAsSigma  # bin RMS used as normal-point sigma
    inputFilesNormalPoints:
      - "{dataDir}/polac/TOTALOBS6924.DAT"
    outputFileNormalPoints: "{outputDir}/normal_points.txt"
    outputFileImportReport: "{outputDir}/normal_point_import_report.txt"
    datasetName: totalobs6924

  # Station ITRF positions (m) and velocities (m/yr) at positionEpochUtc.
  - program: StationCatalogCreate
    outputFileStationCatalog: "{outputDir}/stations.txt"
    stationCoordinates:
      - {key: APOLLO, xyzM: [-1463998.9079, -5166632.7663, 3435012.8921], velocityMPerYear: [-0.0139, -0.0003, -0.0023], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: GRASSE, xyzM: [4581692.1686, 556196.0742, 4389355.1225], velocityMPerYear: [-0.0151, 0.0193, 0.0114], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: HALEAKALA, xyzM: [-5466003.7272, -2404425.9189, 2242197.8916], velocityMPerYear: [-0.0122, 0.0622, 0.0310], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MATERA, xyzM: [4641978.8100, 1393067.5310, 4133249.4800], velocityMPerYear: [-0.0180, 0.0192, 0.0140], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MCDONALD, xyzM: [-1330781.6134, -5328756.4702, 3235697.8262], velocityMPerYear: [-0.0244, -0.0319, 0.0091], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS1, xyzM: [-1330121.0057, -5328532.3595, 3236146.0225], velocityMPerYear: [-0.0124, 0.0009, -0.0053], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS2, xyzM: [-1330021.4931, -5328403.3401, 3236481.6472], velocityMPerYear: [-0.0121, 0.0015, -0.0036], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: WETTZELL, xyzM: [4075576.7721, 931785.5248, 4801583.5601], velocityMPerYear: [-0.0139, 0.0170, 0.0124], positionEpochUtc: "2000-01-01T00:00:00"}

  # Reflector positions in the lunar principal-axis (PA) frame of the
  # chosen ephemeris, metres.
  - program: ReflectorCatalogCreate
    outputFileReflectorCatalog: "{outputDir}/reflectors.txt"
    reflectorCoordinates:
      - {key: APOLLO11, xyzM: [1591966.6407, 690699.4669, 21003.7578]}
      - {key: LUNOKHOD1, xyzM: [1114292.2303, -781298.4355, 1076058.6227]}
      - {key: APOLLO14, xyzM: [1652689.5625, -520997.5929, -109730.5181]}
      - {key: APOLLO15, xyzM: [1554678.3071, 98095.5262, 765005.2077]}
      - {key: LUNOKHOD2, xyzM: [1339363.3937, 801871.9437, 756358.6633]}

  - program: LlrResiduals
    inputFilesNormalPoints:
      - "{outputDir}/normal_points.txt"
    inputFileStationCatalog: "{outputDir}/stations.txt"
    inputFileReflectorCatalog: "{outputDir}/reflectors.txt"

    # Optional UTC time bounds; null processes every normal point.
    startTime: null
    endTime: null

    # Observation uncertainty is read from each input normal-point record.
    # MINI supplies its uncertainty field; CRD supplies the record-11 bin RMS.

    # standard = the compact per-normal-point O-C table: identity, observed
    # and computed RTT, O-C, fitted sigma, elevation, and processing status.
    # full = all model, correction, and input diagnostics.
    outputLevel: standard

    # Normal points below this Moon elevation (degrees) are rejected.
    minElevationDeg: 0.0
    showProgress: true

    # MPI only: normal points per task sent to a worker rank. Ignored in
    # serial execution.
    mpi:
      chunksize: 32

    outputFileObservationResults: "{outputDir}/oc_residuals_w_libration_correction_iers_w_ot_new.txt.gz"
