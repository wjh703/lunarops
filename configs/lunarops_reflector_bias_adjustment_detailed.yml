# ==============================================================================
# LunarOps nonlinear adjustment: reflector coordinates + station range bias
# ==============================================================================
#
# Current program implementation:
#   lunarops/programs/llr_processing.py
# Configurable observation classes are assembled by:
#   lunarops/classes/observation_factory.py
#
# Run serial, single process:
#   uv run python -m lunarops run configs/lunarops_reflector_bias_adjustment_detailed.yml
#
# Run with 32 MPI ranks:
#   uv run mpirun -n 32 python -m lunarops run configs/lunarops_reflector_bias_adjustment_detailed.yml --mpi
#   # or on SLURM:
#   uv run srun python -m lunarops run configs/lunarops_reflector_bias_adjustment_detailed.yml --mpi
#
# Important:
# - LlrReflectorFit has been removed.
# - Reflector fitting is handled by LlrProcessing + reflectorPosition.
# - Local serial ProcessPoolExecutor parallelism has been removed.
# - Do not use the old "parallel" block; MPI process count comes from mpirun.
# - In MPI mode, only the "mpi.chunksize" option below controls O-C task size.
# - rangeBias is the forward-model range-bias class config.
# - stationRangeBias per=station+interval requires explicit intervals.
# - Override variables.* when running with a different data or output directory.
# - Time/Earth-rotation transforms now use ERFA + explicit IERS C04 EOP; Astropy is not required.

variables:
  # ---------------------------------------------------------------------------
  # Base directories
  # ---------------------------------------------------------------------------
  dataDir: ~/deploy_bundle/data
  outputDir: output


globals:
  # ---------------------------------------------------------------------------
  # Ephemerides and EOP
  # ---------------------------------------------------------------------------
  ephemerides:
    type: calceph
    # CALCEPH loads the BSP position and BPC lunar-orientation kernels in this directory.
    directory: "{dataDir}/kernels/inpop21a"
    # INPOP lunar coordinates already use their native relativistic scale.
    lunarRelativisticScaleConvention: alreadyScaled
    longitudeLibrationCorrection: inpop21a

  earthRotation:
    # Explicit IERS C04 EOP file used by the ERFA ITRS<->GCRS transform.
    # No process-global Astropy EOP table is installed or modified.
    type: iersC04
    file: "{dataDir}/auxiliary/eopc04.1962-now.txt"
    # Some concatenated C04 files contain repeated boundary days.
    # This is explicit so duplicate EOP rows are never silently resolved.
    duplicateMjdPolicy: last

  # ---------------------------------------------------------------------------
  # Delay models
  # ---------------------------------------------------------------------------
  # Available troposphere: mendesPavlis | none
  troposphere:
    type: mendesPavlis

  # Available relativity: iersShapiro | none
  relativity:
    type: iersShapiro

  # ---------------------------------------------------------------------------
  # Station / reflector displacement
  # ---------------------------------------------------------------------------
  stationDisplacement:
    - type: iers2010SolidEarthTide
    - type: iers2010PoleTide
    - type: iers2010OceanPoleTide
      coefficientFile: "{dataDir}/auxiliary/opoleloadcoefcmcor.txt"
    - type: iers2010OceanTidalLoading
      coefficientFile: "{dataDir}/auxiliary/fes2022b.txt"
      model: FES2022b

  # Alternative:
  # stationDisplacement:
  #   - type: none

  reflectorDisplacement:
    type: lunarSolidTide
    # Optional lunar solid tide parameters:
    # h2: 0.0
    # l2: 0.0
    # r_moon: 1737400.0

  # Alternative:
  # reflectorDisplacement:
  #   type: none

  # ---------------------------------------------------------------------------
  # Fixed forward-model range-bias correction
  # ---------------------------------------------------------------------------
  # Important modeling choice:
  # - {type: inpop21a} applies built-in fixed station range-bias corrections before
  #   estimation.
  # - {type: none} lets estimated stationRangeBias parameters absorb these effects.
  #
  # For a pure "estimate station range bias from the data" experiment, keep this
  # as none. For INPOP21a-style O-C comparison, switch it to {type: inpop21a}.
  rangeBias:
    type: none

programs:
  # Program names are resolved through lunarops/programs/registry.py. This file
  # LlrProcessing owns estimation and all processing outputs.

  # ---------------------------------------------------------------------------
  # Explicit external-format import
  # ---------------------------------------------------------------------------
  - program: NormalPointsConvert
    inputFilesNormalPoints:
      - "{dataDir}/polac/TOTALOBS6924.DAT"
    outputFileNormalPoints: "{outputDir}/normal_points.txt.gz"
    outputFileImportReport: "{outputDir}/normal_point_import_report.txt.gz"
    datasetName: totalobs6924

  # ---------------------------------------------------------------------------
  # Main nonlinear adjustment
  # ---------------------------------------------------------------------------
  - program: LlrProcessing
    inputFilesNormalPoints:
      - "{outputDir}/normal_points.txt.gz"

    # UTC filtering.
    startTime: null
    endTime: null

    # Catalog resolution overrides. Usually leave null.
    stationName: null
    reflectorName: null

    # Observation uncertainty is read from each input normal-point record.
    # MINI supplies its uncertainty field; CRD supplies record 11 bin RMS.

    # LlrProcessing automatically requests the design partials required by the
    # observation pipeline; no residual-table outputLevel is needed here.

    # Horizon threshold is diagnostic only; rows are not filtered by it.
    minElevationDeg: 3.0

    showProgress: true

    # ITRF station coordinates and secular velocities at the stated UTC epoch.
    stationCoordinates:
      - {key: APOLLO, xyzM: [-1463998.9079, -5166632.7663, 3435012.8921], velocityMPerYear: [-0.0139, -0.0003, -0.0023], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: GRASSE, xyzM: [4581692.1686, 556196.0742, 4389355.1225], velocityMPerYear: [-0.0151, 0.0193, 0.0114], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: HALEAKALA, xyzM: [-5466003.7272, -2404425.9189, 2242197.8916], velocityMPerYear: [-0.0122, 0.0622, 0.0310], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MATERA, xyzM: [4641978.8100, 1393067.5310, 4133249.4800], velocityMPerYear: [-0.0180, 0.0192, 0.0140], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MCDONALD, xyzM: [-1330781.6134, -5328756.4702, 3235697.8262], velocityMPerYear: [-0.0244, -0.0319, 0.0091], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS1, xyzM: [-1330121.0057, -5328532.3595, 3236146.0225], velocityMPerYear: [-0.0124, 0.0009, -0.0053], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS2, xyzM: [-1330021.4931, -5328403.3401, 3236481.6472], velocityMPerYear: [-0.0121, 0.0015, -0.0036], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: WETTZELL, xyzM: [4075576.7721, 931785.5248, 4801583.5601], velocityMPerYear: [-0.0139, 0.0170, 0.0124], positionEpochUtc: "2000-01-01T00:00:00"}

    # Reflector coordinates in the PA frame of the selected ephemeris.
    reflectorCoordinates:
      - {key: APOLLO11, xyzM: [1591966.6407, 690699.4669, 21003.7578]}
      - {key: LUNOKHOD1, xyzM: [1114292.2303, -781298.4355, 1076058.6227]}
      - {key: APOLLO14, xyzM: [1652689.5625, -520997.5929, -109730.5181]}
      - {key: APOLLO15, xyzM: [1554678.3071, 98095.5262, 765005.2077]}
      - {key: LUNOKHOD2, xyzM: [1339363.3937, 801871.9437, 756358.6633]}

    # -------------------------------------------------------------------------
    # Estimated parameters
    # -------------------------------------------------------------------------
    parametrization:
      # -----------------------------------------------------------------------
      # Reflector coordinate corrections
      # -----------------------------------------------------------------------
      # Estimates PA-frame coordinate corrections, 3 parameters per reflector:
      #   <reflector>.position.x
      #   <reflector>.position.y
      #   <reflector>.position.z
      #
      # If reflectors is omitted/null, all observed reflectors are estimated.
      # Builtin reflector keys include:
      #   APOLLO11, APOLLO14, APOLLO15, LUNOKHOD1, LUNOKHOD2
      - type: reflectorPosition
        reflectors:
          - APOLLO11
          - APOLLO14
          - APOLLO15
          - LUNOKHOD1
          - LUNOKHOD2

      # -----------------------------------------------------------------------
      # Station range-bias parameters
      # -----------------------------------------------------------------------
      # Estimates additive one-way station range bias in metres.
      #
      # Choose ONE of these two modes.
      #
      # Mode A: one constant bias per station.
      # Uncomment this block and comment out Mode B below if you want this:
      #
      # - type: stationRangeBias
      #   per: station
      #   stations:
      #     - APOLLO
      #     - GRASSE
      #     - MATERA
      #     - WETTZELL
      #     - MLRS1
      #     - MLRS2
      #
      # Mode B: one bias per station + explicit interval.
      # This is active by default below.
      #
      # Each interval is a mapping with station, start, and end_exclusive;
      # optional name assigns a stable parameter label.
      # Overlapping intervals are allowed by the code; observations inside an
      # overlap activate multiple bias columns. If a solve becomes singular,
      # reduce overlapping intervals or narrow the estimated station set.
      - type: stationRangeBias
        per: station+interval
        intervals:
          # The original table's inclusive dates are represented as
          # [start, end_exclusive). Overlaps remain additive.
          - {station: APOLLO, start: 2006-04-07, end_exclusive: 2010-11-02, name: APOLLO_20060407_20101101}
          - {station: APOLLO, start: 2007-12-15, end_exclusive: 2008-07-01, name: APOLLO_20071215_20080630}
          - {station: APOLLO, start: 2008-09-20, end_exclusive: 2009-06-21, name: APOLLO_20080920_20090620}
          - {station: APOLLO, start: 2010-11-01, end_exclusive: 2012-04-08, name: APOLLO_20101101_20120407}
          - {station: APOLLO, start: 2012-04-07, end_exclusive: 2013-09-03, name: APOLLO_20120407_20130902}
          - {station: GRASSE, start: 1984-06-01, end_exclusive: 1986-06-14, name: GRASSE_19840601_19860613}
          - {station: GRASSE, start: 1987-10-01, end_exclusive: 2005-08-02, name: GRASSE_19871001_20050801}
          - {station: GRASSE, start: 1993-03-01, end_exclusive: 1996-10-02, name: GRASSE_19930301_19961001}
          - {station: GRASSE, start: 1996-12-10, end_exclusive: 1997-01-19, name: GRASSE_19961210_19970118}
          - {station: GRASSE, start: 1997-02-08, end_exclusive: 1998-06-25, name: GRASSE_19970208_19980624}
          - {station: GRASSE, start: 2004-12-04, end_exclusive: 2004-12-08, name: GRASSE_20041204_20041207}
          - {station: GRASSE, start: 2005-01-03, end_exclusive: 2005-01-07, name: GRASSE_20050103_20050106}
          - {station: GRASSE, start: 2009-11-01, end_exclusive: 2014-01-02, name: GRASSE_20091101_20140101}
          - {station: HALEAKALA, start: 1984-11-01, end_exclusive: 1990-09-02, name: HALEAKALA_19841101_19900901}
          - {station: HALEAKALA, start: 1984-11-01, end_exclusive: 1986-04-02, name: HALEAKALA_19841101_19860401}
          - {station: HALEAKALA, start: 1986-04-02, end_exclusive: 1987-07-31, name: HALEAKALA_19860402_19870730}
          - {station: HALEAKALA, start: 1987-07-31, end_exclusive: 1987-08-15, name: HALEAKALA_19870731_19870814}
          - {station: HALEAKALA, start: 1985-06-09, end_exclusive: 1985-06-11, name: HALEAKALA_19850609_19850610}
          - {station: HALEAKALA, start: 1987-11-10, end_exclusive: 1988-02-19, name: HALEAKALA_19871110_19880218}
          - {station: HALEAKALA, start: 1989-01-28, end_exclusive: 1989-01-30, name: HALEAKALA_19890128_19890129}
          - {station: HALEAKALA, start: 1989-08-23, end_exclusive: 1989-08-25, name: HALEAKALA_19890823_19890824}
          - {station: HALEAKALA, start: 1990-02-06, end_exclusive: 1990-09-02, name: HALEAKALA_19900206_19900901}
          - {station: MCDONALD, start: 1969-01-01, end_exclusive: 1985-07-02, name: MCDONALD_19690101_19850701}
          - {station: MCDONALD, start: 1971-12-01, end_exclusive: 1972-12-06, name: MCDONALD_19711201_19721205}
          - {station: MCDONALD, start: 1972-04-21, end_exclusive: 1972-04-28, name: MCDONALD_19720421_19720427}
          - {station: MCDONALD, start: 1974-08-18, end_exclusive: 1974-10-17, name: MCDONALD_19740818_19741016}
          - {station: MCDONALD, start: 1975-10-05, end_exclusive: 1976-03-02, name: MCDONALD_19751005_19760301}
          - {station: MCDONALD, start: 1983-12-01, end_exclusive: 1984-01-18, name: MCDONALD_19831201_19840117}
          - {station: MATERA, start: 2003-01-01, end_exclusive: 2016-01-02, name: MATERA_20030101_20160101}
          - {station: MLRS1, start: 1983-08-01, end_exclusive: 1988-01-29, name: MLRS1_19830801_19880128}
          - {station: WETTZELL, start: 2018-01-01, end_exclusive: null, name: WETTZELL_20180101_PRESENT}

    varianceComponents:
      # Exactly one component must match each retained observation.
      # CERGA MeO/IR overlap is separated by laser wavelength. The strict one-match rule is
      # enforced directly and is not a configurable policy.
      - {id: MCDONALD_1969_1985, station: MCDONALD, start: 1969-01-01, endExclusive: 1986-01-01}
      - {id: MLRS1_1983_1988, station: MLRS1, start: 1983-01-01, endExclusive: 1989-01-01}
      - {id: MLRS2_1988_2015, station: MLRS2, start: 1988-01-01, endExclusive: 2016-01-01}
      - {id: HALEAKALA_1984_1990, station: HALEAKALA, start: 1984-01-01, endExclusive: 1991-01-01}
      - {id: CERGA_RUBY_1984_1986, station: GRASSE, start: 1984-01-01, endExclusive: 1987-01-01}
      - {id: CERGA_YAG_1987_2005, station: GRASSE, start: 1987-01-01, endExclusive: 2006-01-01}
      - {id: CERGA_MEO_2009_PRESENT, station: GRASSE, start: 2009-01-01, endExclusive: null, wavelengthMaxExclusiveNm: 700.0}
      - {id: CERGA_IR_2015_PRESENT, station: GRASSE, start: 2015-01-01, endExclusive: null, wavelengthMinNm: 700.0}
      - {id: APACHE_2006_PRESENT, station: APOLLO, start: 2006-01-01, endExclusive: null}
      - {id: MATERA_2003_PRESENT, station: MATERA, start: 2003-01-01, endExclusive: null}
      - {id: WETTZELL_2018_PRESENT, station: WETTZELL, start: 2018-01-01, endExclusive: null}

    # GROOPS-style process flow. Parameter selections affect subsequent
    # estimates; output steps consume the final estimate state.
    processingSteps:
      # Applied once. Rejected observations never enter any estimate below.
      - type: screenObservations
        residual:
          maximumAbsoluteM: 2.0
          maximumAbsoluteByStationM:
            APOLLO: 0.5
            GRASSE: 1.0
            MATERA: 0.5
            WETTZELL: 0.5
            HALEAKALA: 1.5
            MCDONALD: 2.0
            MLRS1: 1.0
            MLRS2: 1.5
        reportedSigma:
          # Reported one-way sigmas below this group-aware validity limit are
          # permanently rejected. Retained sigmas are not changed or floored.
          minimumOneWayM: 1.0e-3
          minimumFractionOfGroupMedian: 0.1

      - type: selectParametrizations
        parametrizations: [reflectorPosition]
      - type: estimate
        name: reflector
        maxIterationCount: 8
        convergenceThresholdByParametrizations:
          reflectorPosition: 1.0e-3
        robustWeighting: &robustWeighting
          # igg3 uses k0 and k1. directRejection uses k0 only.
          model: igg3
          k0: 1.5
          k1: 6.0

      - type: selectParametrizations
        parametrizations: [stationRangeBias]
      - type: estimate
        name: bias
        maxIterationCount: 8
        convergenceThresholdByParametrizations:
          stationRangeBias: 3.0e-3
        robustWeighting: *robustWeighting

      - type: selectParametrizations
        parametrizations: [reflectorPosition, stationRangeBias]
      - type: estimate
        name: joint
        maxIterationCount: 10
        convergenceThresholdByParametrizations:
          reflectorPosition: 1.0e-3
          stationRangeBias: 3.0e-3
        computeResiduals: true
        estimateVarianceFactors: true
        estimateRobustWeights: true
        robustWeighting: *robustWeighting

      - type: writeResiduals
        outputFile: "{outputDir}/reflector_bias_postfit_residuals_igg3.txt.gz"
        outputLevel: full

      - type: writeNormalEquations
        outputFile: "{outputDir}/reflector_bias_adjustment_normals_igg3"

      - type: writeResults
        outputFileReport: "{outputDir}/reflector_bias_processing_report_igg3.txt"
        outputFileState: "{outputDir}/reflector_bias_processing_state_igg3.txt"
        outputFileSolution: "{outputDir}/reflector_bias_solution_igg3.txt"
        outputFileCovariance: "{outputDir}/reflector_bias_covariance_igg3"
        outputFileReflectorCatalog: "{outputDir}/reflector_catalog_estimated_igg3.txt"

    # MPI task granularity; ignored in normal serial execution.
    mpi:
      chunksize: 32
