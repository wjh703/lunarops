# yaml-language-server: $schema=lunarops.schema.json
# Integrate a three-day arc of the coupled lunar orbit and rotation with a
# rigid mantle and an axisymmetric fluid core (DE430 models, major bodies
# only).
#
# Initial conditions are from Folkner et al. (2014), Table 7, at JD(TDB)
# 2440400.5; the 3-1-3 Euler angles (phi, theta, psi) are PA to inertial, and
# the angular velocities are converted from rad/day to rad/s. Moments of
# inertia and core friction are from Table 11, normalized by the whole-Moon
# M R^2. The inertia is constant: anelastic deformation and asteroid
# perturbations are not modelled. This is a numerical test case and is not
# expected to reproduce DE430.
#
# To check step-size convergence, rerun with half steps:
#   --set stepSeconds=900 --set startupStepSeconds=112.5
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_rotation_rigid_de430.yml
# Run with 3 local worker processes (this process integrates, the workers
# supply ephemeris data for the integration epochs):
#   python -m lunarops run configs/lunarops_orbit_rotation_rigid_de430.yml --workers 3
#
# Edit before running:
#   kernelDir   SPICE kernel directory (reference trajectory and initial state)
#   outputDir   directory for all products
#   durationSeconds, outputStepSeconds, stepSeconds, startupStepSeconds  (s)
#   inputFileMassCatalog and gravityFields.*.path  mass catalog and static
#               gravity fields
# Relative paths resolve against the working directory (see --working-dir).
variables:
  kernelDir: ../data/kernels/de430
  outputDir: ./output/rotation_rigid_de430
  durationSeconds: 259200.0
  outputStepSeconds: 1800.0
  stepSeconds: 1800.0
  startupStepSeconds: 225.0
programs:
- program: LunarOrbitPropagation
  ephemerides:
    type: chebyshev
    directory: '{kernelDir}'
    # Lunar coordinates are used in the kernel's native scale.
    lunarRelativisticScaleConvention: alreadyScaled
    longitudeLibrationCorrection: none
  earthDynamicsFrame: de430
  # Initial epoch JD(TDB) 2440400.5, the DE430/DE440 integration start.
  initialTdbJd1: 2440400.5
  initialTdbJd2: 0.0
  durationSeconds: '{durationSeconds}'
  inputFileMassCatalog: ../data/auxiliary/de430_mass_catalog.txt
  externalBodyGroups:
  - de430_major
  externalBodyIds: []
  outputStepSeconds: '{outputStepSeconds}'
  accelerationDiagnosticsStepSeconds: 86400.0
  includeEih: true
  bodyForceTerms:
  - point_mass
  - eih_1pn
  - solar_j2
  - figure_earth
  - figure_moon
  - tide
  gravityFields:
    earth:
      path: ../data/auxiliary/DE430_EARTH_STATIC.gfc
      allowMissingCoefficients: true  # zonal-only field; absent terms are zero
      maxDegree: 5
      name: DE430 Earth static field
    moon:
      path: ../data/auxiliary/DE430_MOON_STATIC.gfc
      maxDegree: 6
      name: DE430 Moon static field
  earthJ2TimeVariation:
    referenceJdTdb: 2451545.0
    linearPerYear: -2.6e-11
    quadraticPerYear2: 0.0
  moonFigurePartners: [EARTH, SUN, MERCURY, VENUS, MARS BARYCENTER, JUPITER BARYCENTER]
  earthTide:
    tideRaisers:
    - MOON
    - SUN
    k20: 0.335
    k21: 0.32
    k22: 0.32
    tauOrbDays:
    - 0.064
    - -0.044
    - -0.1
    tauRotDays:
    - 0.0
    - 0.007363219022804189
    - 0.002535297863338872
    earthRotationRateRadS: 7.29211514670698e-05
    earthRadiusM: 6378136.3
  solarJ2: 2.110608853272684e-07
  solarRadiusM: 696000000.0
  solarRelativistic: null
  stepSeconds: '{stepSeconds}'
  integratorOrder: 13
  correctorIterations: 2
  historyInterpolationOrder: 13
  trajectoryInterpolationOrder: 13
  startupStepSeconds: '{startupStepSeconds}'
  outputFileOrbit: '{outputDir}/lunar_orbit.dat'
  outputFileAccelerationDiagnostics: '{outputDir}/lunar_acceleration_diagnostics.dat'
  outputFileMetadata: '{outputDir}/lunar_orbit_metadata.txt'
  # Integrated lunar rotation: mantle attitude and angular velocity, with an
  # optional fluid core. Moments of inertia are normalized by the whole-Moon
  # M R^2; the Euler angles are 3-1-3 (phi, theta, psi), PA to inertial, in rad; angular
  # velocities are in rad/s.
  lunarRotation:
    inertiaMoments:
    - 0.392894284681978
    - 0.3929838156443403
    - 0.39314226584780865
    radiusM: 1738000.0
    initialEulerAnglesRad:
    - 0.0051283003141183925
    - 0.3823927842017369
    - 1.294167002748783
    initialAngularVelocityRadS:
    - 5.2936622523049e-10
    - -2.5345622056399883e-11
    - 2.6613988447907697e-06
    initialCoreAngularVelocityRadS:
    - -7.660147826942412e-08
    - -1.2418454300810776e-08
    - 2.6579721819791354e-06
    # Bodies whose gravity exerts torque on the lunar figure.
    sources:
    - EARTH
    - SUN
    - MERCURY
    - VENUS
    - MARS BARYCENTER
    - JUPITER BARYCENTER
    # Torque model: figure (the full lunar gravity field) or quadrupole.
    # earthFigureTorque adds the torque from Earth's oblateness;
    # geodeticPrecession adds the relativistic geodetic precession.
    gravityTorque: figure
    earthFigureTorque: true
    geodeticPrecession: false
    # Fluid core: polar moment as a fraction of the total polar moment C,
    # core-mantle boundary flattening, and viscous core-mantle coupling
    # k_v/C_c (1/s; 0 disables it).
    core:
      polarMomentFraction: 0.0007
      flattening: 0.0002462390478919815
      viscosityPerS: 7.446777275531163e-14
  # Integrated mantle/core attitude and angular velocity time series.
  outputFileRotation: '{outputDir}/lunar_rotation.dat'
