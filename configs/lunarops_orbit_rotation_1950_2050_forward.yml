# yaml-language-server: $schema=lunarops.schema.json
# Integrate the coupled lunar orbit and rotation one-sided over 1950-2050:
# from JD(TDB) 2433282.5 (1950-01-01) forward for 36525 days, with the full
# DE440 model of base/dynamics_de440.yml and the variational equations.
#
# The initial values and the estimated dynamical parameters come from a
# lunarDynamicsParameters file (parametersFile), not from the ephemeris: the
# DE440 kernels supply only the Earth-Moon barycentre and the other bodies.
# The integrator is PECE with one correction.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_rotation_1950_2050_forward.yml
# Run with worker processes:
#   python -m lunarops run configs/lunarops_orbit_rotation_1950_2050_forward.yml --workers 6
extends: base/dynamics_de440.yml
variables:
  outputDir: ./output/orbit_rotation_1950_2050_forward
  parametersFile: configs/lunar_dynamics_parameters_de440_1950.txt
  initialTdbJd1: 2433282.5
  durationSeconds: 3155760000.0
  # 5400 s against 2700 s over +-50 yr: orbit within 0.15 mm, Euler angles within
  # 8e-12 rad, partials within 2.4e-6; 10800 s is unstable in the rotation.
  stepSeconds: 5400.0
  startupStepSeconds: 675.0
  correctorIterations: 1
  # Variational equations: partials of the state with respect to the 15
  # initial values and every dynamical parameter, sampled every 6 h.
  variationalEquations:
    parameters: null
    outputStepSeconds: 21600.0
  outputFilePartials: "{outputDir}/lunar_dynamics_partials.dat"
