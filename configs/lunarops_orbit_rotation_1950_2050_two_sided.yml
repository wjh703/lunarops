# yaml-language-server: $schema=lunarops.schema.json
# Integrate the coupled lunar orbit and rotation two-sided over 1950-2050:
# from JD(TDB) 2451545.0 (J2000) backward and forward for 18262.5 days each,
# with the full DE440 model of base/dynamics_de440.yml and the variational
# equations.
#
# The initial values and the estimated dynamical parameters come from a
# lunarDynamicsParameters file (parametersFile), not from the ephemeris: the
# DE440 kernels supply only the Earth-Moon barycentre and the other bodies.
# The integrator is PECE with one correction.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_rotation_1950_2050_two_sided.yml
# Run with worker processes (the backward arc runs in a process of its own):
#   python -m lunarops run configs/lunarops_orbit_rotation_1950_2050_two_sided.yml --workers 6
extends: base/dynamics_de440.yml
variables:
  outputDir: ./output/orbit_rotation_1950_2050_two_sided
  parametersFile: configs/lunar_dynamics_parameters_de440_j2000.txt
  initialTdbJd1: 2451545.0
  durationSeconds: 1577880000.0
  backwardDurationSeconds: 1577880000.0
  # 5400 s against 2700 s over +-50 yr: orbit within 0.15 mm, Euler angles within
  # 8e-12 rad, partials within 2.4e-6; 10800 s is unstable in the rotation.
  stepSeconds: 5400.0
  startupStepSeconds: 675.0
  correctorIterations: 1
  # Variational equations: the partials of the state with respect to the 15
  # initial values and to every dynamical parameter of the model (parameters:
  # null), integrated beside the state and sampled every 6 h (a whole multiple
  # of stepSeconds). They do not change the state but cost many right-hand-side
  # evaluations per step; the table holds 1 + 15 * 27 columns per row. Set both
  # to null for a plain propagation.
  variationalEquations:
    parameters: null
    outputStepSeconds: 21600.0
  outputFilePartials: "{outputDir}/lunar_dynamics_partials.dat"
