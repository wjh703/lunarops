# yaml-language-server: $schema=lunarops.schema.json
# LLR O-C residuals with INPOP21a; the run is in base/oc_residuals.yml.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_oc_residuals_inpop21a.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate normal points):
#   mpirun -n 16 python -m lunarops run configs/lunarops_oc_residuals_inpop21a.yml --mpi
extends: [base/oc_residuals.yml, base/ephemeris_inpop21a.yml]
