# yaml-language-server: $schema=lunarops.schema.json
# DE440 O-C residuals with the DE440 lunar coordinates taken without the lunar-surface scale conversion; the run is in base/oc_residuals.yml.
#
# This variant does not convert normal points: it reads
# {outputDir}/normal_points.txt, written by the NormalPointsConvert step of
# configs/lunarops_oc_residuals.yml with the same outputDir.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_oc_residuals_de440_alreadyScaled.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate normal points):
#   mpirun -n 16 python -m lunarops run configs/lunarops_oc_residuals_de440_alreadyScaled.yml --mpi
extends: [base/oc_residuals.yml, base/ephemeris_de440.yml]
variables:
  dataDir: ~/deploy_bundle/data
  outputDir: ./output
  importNormalPoints: false
  residualFile: oc_residuals_de440_alreadyScaled.txt
