# yaml-language-server: $schema=lunarops.schema.json
# Predict Apollo 15 pointing from Urumqi on a fixed list of nights, for
# comparison with an externally supplied azimuth/elevation table.
#
# LlrObservationPrediction runs once per entry of loop.values; each night
# covers 23:00:00-23:59:50 local time (UTC+08:00) on a 10 s grid and writes
# its own prediction and window files. It uses the INPOP21a kernels.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_observation_prediction_a15_comparison_202505.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate time-grid epochs):
#   mpirun -n 16 python -m lunarops run configs/lunarops_observation_prediction_a15_comparison_202505.yml --mpi
#
# Edit before running:
#   dataDir    directory holding kernels/inpop21a and auxiliary/ (EOP, tide files)
#   outputDir  directory for all products (relative to the working directory)
#   loop.values  the local dates (YYYY-MM-DD) to predict

variables:
  dataDir: ~/deploy_bundle/data
  outputDir: ./output

models:
  ephemerides:
    type: chebyshev
    directory: "{dataDir}/kernels/inpop21a"
    # INPOP lunar coordinates are already in their native relativistic scale.
    lunarRelativisticScaleConvention: alreadyScaled
    # Longitude-libration correction in the lunar PA -> LCRS orientation.
    longitudeLibrationCorrection: inpop21a
  earthRotation:
    type: file
    file: "{outputDir}/a15_comparison_eop_merged.txt"
  # Geometry only: no tropospheric or Shapiro delay.
  troposphere: {type: none}
  relativity: {type: none}
  stationDisplacement:
    - type: iers2010SolidEarthTide
    - type: iers2010PoleTide
    - type: iers2010OceanPoleTide
      coefficientFile: "{dataDir}/auxiliary/opoleloadcoefcmcor.txt"
  reflectorDisplacement: {type: lunarSolidTide}
programs:
  - program: IersC04EarthOrientationParameter
    inputFileC04: "{dataDir}/auxiliary/eopc04.1962-now.txt"
    outputFileEarthOrientationParameter: "{outputDir}/a15_comparison_eop_c04.txt"

  - program: IersRapidEarthOrientationParameter
    inputFileFinals2000A: "{dataDir}/auxiliary/finals2000A.all"
    outputFileEarthOrientationParameter: "{outputDir}/a15_comparison_eop_rapid.txt"

  - program: EarthOrientationParameterMerge
    inputFileC04EarthOrientationParameter: "{outputDir}/a15_comparison_eop_c04.txt"
    inputFileRapidEarthOrientationParameter: "{outputDir}/a15_comparison_eop_rapid.txt"
    outputFileEarthOrientationParameter: "{outputDir}/a15_comparison_eop_merged.txt"

  - program: StationCatalogCreate
    outputFileStationCatalog: "{outputDir}/a15_comparison_stations.txt"
    stationCoordinates:
      - key: Urumqi
        longitudeDeg: 87.1666666667
        latitudeDeg: 43.4666666667
        heightM: 2080.0
        velocityMPerYear: [0.0, 0.0, 0.0]
        positionEpochUtc: "2020-01-01T00:00:00"

  - program: ReflectorCatalogCreate
    outputFileReflectorCatalog: "{outputDir}/a15_comparison_reflectors.txt"
    reflectorCoordinates:
      - {key: APOLLO15, xyzM: [1554678.3071, 98095.5262, 765005.2077]}

  - program: LlrObservationPrediction
    meteorologyPolicy: nominal  # representative station conditions
    # Repeat this program once per value; {observationDate} is substituted
    # into the times and file names below.
    loop:
      variable: observationDate
      values: ["2026-09-13", "2026-09-14", "2026-09-15", "2026-09-16", "2026-09-17"]
    inputFileStationCatalog: "{outputDir}/a15_comparison_stations.txt"
    inputFileReflectorCatalog: "{outputDir}/a15_comparison_reflectors.txt"
    outputFilePrediction: "{outputDir}/a15_comparison_{observationDate}_prediction.txt"
    outputFileWindows: "{outputDir}/a15_comparison_{observationDate}_windows.txt"
    startTime: "{observationDate}T23:00:00"
    endTime: "{observationDate}T23:59:50"
    # startTime/endTime are local time at UTC+08:00; grid step in seconds.
    utcOffsetHours: 8.0
    stepSeconds: 10.0
    mpi:
      chunksize: 16
    stationName: Urumqi
    reflectorName: APOLLO15
    # Visibility conditions in degrees: Moon elevation at the station,
    # station elevation seen from the reflector, maximum Sun elevation,
    # and accepted lunar mean-elongation intervals (0-360, inclusive).
    minElevationDeg: 3.0
    minReflectorElevationDeg: 3.0
    maxSunElevationDeg: -6.0
    allowedElongationRangesDeg:
      - {startDeg: 30.0, endDeg: 150.0}
      - {startDeg: 180.0, endDeg: 330.0}
    showProgress: true
