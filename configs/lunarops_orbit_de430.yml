# Propagate the Moon relative to a prescribed Earth with DE430 force models
# and compare the result with the DE430 reference ephemeris.
#
# The run uses the DE430 SPICE kernels and the DE430 GM, tide and lunar
# inertia constants (Folkner et al. 2014). The DE430 Earth dynamics frame
# and the linear time variation of Earth's J2 are set explicitly. Orbit and
# acceleration diagnostics use the same cadence and force groups as
# configs/lunarops_orbit_de440.yml.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_de430.yml
# Run with MPI (at least 2 ranks; rank 0 integrates, the other ranks supply
# ephemeris data for the integration epochs):
#   mpirun -n 4 python -m lunarops run configs/lunarops_orbit_de430.yml --mpi
#
# Edit before running:
#   kernelDir   DE430 SPICE kernel directory
#   outputDir   directory for all products
#   durationSeconds, outputStepSeconds, stepSeconds, startupStepSeconds  (s)
#   inputFileMassCatalog  DE430 mass catalog
#   gravityFields.*.path  Earth and Moon static gravity fields
# Relative paths resolve against the working directory (see --working-dir).

variables:
  kernelDir: ../data/kernels/de430
  outputDir: ./output/de430
  durationSeconds: 315360000.0
  outputStepSeconds: 5400.0
  stepSeconds: 5400.0
  startupStepSeconds: 675.0

programs:
  - program: LunarOrbitPropagation
    ephemerides:
      type: calceph
      directory: "{kernelDir}"
      # Lunar coordinates are used in the kernel's native scale.
      lunarRelativisticScaleConvention: alreadyScaled
      longitudeLibrationCorrection: none
    # Earth dynamics frame: de430 or de440.
    earthDynamicsFrame: de430
    # Initial epoch as a two-part TDB Julian date (jd1 + jd2); 2451545.0 = J2000.
    initialTdbJd1: 2451545.0
    initialTdbJd2: 0.0
    # Integration span in seconds; negative values integrate backwards.
    durationSeconds: "{durationSeconds}"
    inputFileMassCatalog: "../data/auxiliary/de430_mass_catalog.txt"
    externalBodyGroups: [de430_major, de430_asteroid]
    # Perturbing bodies: groups from the mass catalog plus individual body IDs.
    externalBodyIds: []
    outputStepSeconds: "{outputStepSeconds}"
    # Sampling of the per-force-group acceleration diagnostics, seconds; must
    # be a multiple of stepSeconds (null disables the diagnostics).
    accelerationDiagnosticsStepSeconds: 86400.0
    includeEih: true
    # Force terms; DE430 has no solar Lense-Thirring or radiation-pressure term.
    bodyForceTerms: [point_mass, eih_1pn, solar_j2, figure_earth, figure_moon, tide]
    # Static spherical-harmonic fields (.gfc), truncated at maxDegree.
    gravityFields:
      earth:
        path: "../data/auxiliary/DE430_EARTH_STATIC.gfc"
        allowMissingCoefficients: true  # zonal-only field; absent terms are zero
        maxDegree: 5
        name: DE430 Earth static field
      moon:
        path: "../data/auxiliary/DE430_MOON_STATIC.gfc"
        maxDegree: 6
        name: DE430 Moon static field
    # J2(t) = J2(J2000) + linearPerYear * T, T in Julian years.
    earthJ2TimeVariation:
      referenceJdTdb: 2451545.0
      linearPerYear: -2.600000000e-11
      quadraticPerYear2: 0.0
    # Earth is prescribed, so only the direct Earth-figure acceleration on the
    # Moon is evaluated. The Moon-figure terms use the full DE430 partner set.
    moonFigurePartners: [EARTH, SUN, MERCURY, VENUS, MARS BARYCENTER, JUPITER BARYCENTER]
    # DE430 lunar degree-2 time-variable gravity: undistorted J2, moment
    # ratios beta and gamma, Love number k2 and tidal delay (days).
    lunarDegree2Gravity:
      j2Undistorted: 2.0321568464952570e-4
      beta: 6.3102131934887270e-4
      gamma: 2.2773171480091860e-4
      loveK2: 0.024059
      tidalDelayDays: 0.09583054727330669
      radiusM: 1738000.0
      meanMotionRadS: 2.6616995e-6
    # Earth tides raised by tideRaisers: Love numbers k2m and orbital/rotational
    # time lags (days) per order m = 0, 1, 2.
    earthTide:
      tideRaisers: [MOON, SUN]
      k20: 0.335
      k21: 0.32
      k22: 0.32
      tauOrbDays: [0.0640, -0.044, -0.1000]
      tauRotDays: [0.0, 0.007363219022804189, 0.002535297863338872]
      earthRotationRateRadS: 7.29211514670698e-5
      earthRadiusM: 6378136.3
    # Solar oblateness J2 and solar radius (m).
    solarJ2: 2.110608853272684e-7
    solarRadiusM: 696000000.0
    # DE430 has no solar Lense-Thirring or radiation-pressure terms.
    solarRelativistic: null
    # Fixed-step predictor-corrector integrator: step (s), order, number of
    # corrector passes and interpolation orders. startupStepSeconds is the
    # smaller step used while the integrator history is built.
    stepSeconds: "{stepSeconds}"
    integratorOrder: 13
    correctorIterations: 2
    historyInterpolationOrder: 13
    trajectoryInterpolationOrder: 13
    startupStepSeconds: "{startupStepSeconds}"
    # Orbit table (Earth, Moon, EMB and Moon-relative states plus RTN differences
    # from the reference ephemeris), acceleration diagnostics, and metadata.
    outputFileOrbit: "{outputDir}/lunar_orbit.dat"
    outputFileAccelerationDiagnostics: "{outputDir}/lunar_acceleration_diagnostics.dat"
    outputFileMetadata: "{outputDir}/lunar_orbit_metadata.txt"
