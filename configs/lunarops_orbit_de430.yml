# yaml-language-server: $schema=lunarops.schema.json
# Propagate the geocentric lunar orbit for ten years from J2000 with the DE430
# force model and the DE430 degree-2 lunar gravity (no integrated rotation),
# and compare the result with the DE430 reference ephemeris. The model is in
# base/dynamics_de430.yml.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_de430.yml
# Run with 3 local worker processes:
#   python -m lunarops run configs/lunarops_orbit_de430.yml --workers 3
extends: base/dynamics_de430.yml
variables:
  outputDir: ./output/orbit_de430
  initialTdbJd1: 2451545.0
  durationSeconds: 315360000.0  # 3650 days
  outputStepSeconds: 5400.0
  stepSeconds: 5400.0
  startupStepSeconds: 675.0
  lunarRotation: null
  outputFileRotation: null
  # DE430 lunar degree-2 time-variable gravity: undistorted J2, moment ratios
  # beta and gamma, Love number k2 and tidal delay (days).
  lunarDegree2Gravity:
    j2Undistorted: 2.0321568464952570e-4
    beta: 6.3102131934887270e-4
    gamma: 2.2773171480091860e-4
    loveK2: 0.024059
    tidalDelayDays: 0.09583054727330669
    radiusM: 1738000.0
    meanMotionRadS: 2.6616995e-6
