# Force-model ablation: propagate the lunar orbit with individual force
# terms or perturbing-body groups switched off, to measure how much each one
# contributes to the difference from the DE440 reference ephemeris.
#
# With the defaults below the run uses the full DE440 force model
# (testName=baseline). Run one case at a time by overriding the variables
# testName, externalBodyGroups, includeEih, forceTerms or the lunar
# deformation switches with --set. Each case writes to
# output/ablation/{testName}.
#
# Run (serial), e.g. without the SB441 asteroid/KBO perturbers:
#   python -m lunarops run configs/lunarops_orbit_ablation.yml --working-dir . \
#     --set testName=no_sb441 \
#     --set externalBodyGroups='[de440_major]'
# Run with MPI (at least 2 ranks; rank 0 integrates, the other ranks supply
# ephemeris data for the integration epochs):
#   mpirun -n 4 python -m lunarops run configs/lunarops_orbit_ablation.yml --mpi
#
# All cases share the initial state, kernels, step size and output format;
# only the overridden force or body selection changes.
#
# Edit before running: kernelDir, outputDir, massCatalogFile and the gravity
# field files. Relative paths resolve against the working directory.

variables:
  kernelDir: ../data/kernels/de440
  outputDir: ./output/ablation/{testName}
  durationSeconds: 2592000.0       # 30 days; increase for longer comparisons
  # Case label; also names the output subdirectory.
  testName: baseline
  # Mass-catalog groups used as perturbing bodies: de440_major, sb441
  # (or its parts sb441_asteroid, sb441_kbo).
  externalBodyGroups: [de440_major, sb441]
  # Einstein-Infeld-Hoffmann 1PN accelerations on/off.
  includeEih: true
  massCatalogFile: ../data/auxiliary/de440_sb441_mass_catalog.txt
  earthGravityFile: ../data/auxiliary/DE440_EARTH_STATIC.gfc
  earthGravityDegree: 5
  earthGravityName: DE440 Earth static field
  moonGravityFile: ../data/auxiliary/DE440_MOON_STATIC.gfc
  moonGravityDegree: 6
  moonGravityName: DE440 Moon static field
  # Lunar degree-2 gravity: tidal delay (days) and the tidal/rotational
  # deformation switches used in lunarDegree2GravityConfig.
  lunarDelayDays: 0.14519388258636395
  lunarIncludeTidalDeformation: true
  lunarIncludeRotationalDeformation: true
  lunarDegree2GravityConfig:
    j2Undistorted: 2.0321436013500001e-4
    beta: 6.3122040737914229e-4
    gamma: 2.2778898477433167e-4
    loveK2: 0.02419
    # Unnormalized DE440 static C21/S21/S22 (Pavlov, Eq. 16).
    c21Static: 2.2779569194479859e-10
    s21Static: 1.3343450358392620e-9
    s22Static: 0.0
    tidalDelayDays: "{lunarDelayDays}"
    radiusM: 1738000.0
    meanMotionRadS: 2.6616995e-6
    includeTidalDeformation: "{lunarIncludeTidalDeformation}"
    includeRotationalDeformation: "{lunarIncludeRotationalDeformation}"
  # Force terms passed to bodyForceTerms; remove an entry to switch it off.
  forceTerms:
    - point_mass
    - eih_1pn
    - solar_j2
    - figure_earth
    - figure_moon
    - tide
    - lense_thirring
    - solar_radiation_pressure

programs:
  - program: LunarOrbitPropagation
    ephemerides:
      type: calceph
      directory: "{kernelDir}"
      # DE lunar coordinates use the lunar-surface relativistic scale.
      lunarRelativisticScaleConvention: tdbCompatibleLunarSurface
      longitudeLibrationCorrection: none
    initialTdbJd1: 2451545.0
    initialTdbJd2: 0.0
    durationSeconds: "{durationSeconds}"
    inputFileMassCatalog: "{massCatalogFile}"
    externalBodyGroups: "{externalBodyGroups}"
    externalBodyIds: []
    outputStepSeconds: 86400.0
    accelerationDiagnosticsStepSeconds: 86400.0
    includeEih: "{includeEih}"
    bodyForceTerms: "{forceTerms}"
    gravityFields:
      earth:
        path: "{earthGravityFile}"
        allowMissingCoefficients: true  # zonal-only field; absent terms are zero
        maxDegree: "{earthGravityDegree}"
        name: "{earthGravityName}"
      moon:
        path: "{moonGravityFile}"
        allowMissingCoefficients: true  # sparse field; absent terms are zero
        maxDegree: "{moonGravityDegree}"
        name: "{moonGravityName}"
    earthJ2TimeVariation:
      referenceJdTdb: 2451545.0
      linearPerYear: -5.900000000e-12
      quadraticPerYear2: 9.000000000e-13
    moonFigurePartners: [EARTH, SUN, MERCURY BARYCENTER, VENUS BARYCENTER, MARS BARYCENTER, JUPITER BARYCENTER, SATURN BARYCENTER]
    lunarDegree2Gravity: "{lunarDegree2GravityConfig}"
    earthTide:
      tideRaisers: [MOON, SUN]
      k20: 0.335
      k21: 0.277
      k22: 0.283
      tauOrbDays: [0.077, -0.010, -0.20982243826832672]
      tauRotDays: [0.0, 0.011929122823877609, -0.0007423627529883070]
      earthRotationRateRadS: 7.29211514670698e-5
      earthRadiusM: 6378136.6
    solarJ2: 2.1961391516529825e-7
    solarRadiusM: 696000000.0
    solarRelativistic:
      includeLenseThirring: true
      includeRadiationPressure: true
      moonEpsilon: 1.44e-13
    stepSeconds: 5400.0
    integratorOrder: 13
    correctorIterations: 2
    historyInterpolationOrder: 13
    trajectoryInterpolationOrder: 13
    startupStepSeconds: 675.0
    outputFileOrbit: "{outputDir}/lunar_orbit.dat"
    outputFileAccelerationDiagnostics: "{outputDir}/lunar_acceleration_diagnostics.dat"
    outputFileMetadata: "{outputDir}/lunar_orbit_metadata.txt"
