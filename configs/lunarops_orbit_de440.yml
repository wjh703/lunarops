# yaml-language-server: $schema=lunarops.schema.json
# Propagate the Earth-Moon relative orbit about the ephemeris EMB with DE440
# force models and compare the result with the DE440 reference ephemeris.
#
# The orbit is written on the integration grid (outputStepSeconds) and the
# acceleration diagnostics are sampled daily. The diagnostics hold one
# acceleration per force group: Newtonian, post-Newtonian, figure (solar J2
# and Earth/Moon figure, including the lunar time-varying inertia), Earth
# tide, solar radiation pressure, and Lense-Thirring.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_de440.yml
# Run with MPI (at least 2 ranks; rank 0 integrates, the other ranks supply
# ephemeris data for the integration epochs):
#   mpirun -n 4 python -m lunarops run configs/lunarops_orbit_de440.yml --mpi
#
# Edit before running:
#   kernelDir   DE440 SPICE kernel directory
#   outputDir   directory for all products
#   durationSeconds, outputStepSeconds, stepSeconds, startupStepSeconds  (s)
#   externalBodyGroups  mass-catalog groups used as perturbing bodies
#   inputFileMassCatalog  mass catalog written by configs/lunarops_mass_catalog.yml
#   gravityFields.*.path  Earth and Moon static gravity fields
# Relative paths resolve against the working directory (see --working-dir).

variables:
  kernelDir: ../data/kernels/de440
  outputDir: ./output/de440
  durationSeconds: 315360000.0
  outputStepSeconds: 5400.0
  stepSeconds: 5400.0
  startupStepSeconds: 675.0
  externalBodyGroups: [de440_major, sb441]

programs:
  - program: LunarOrbitPropagation
    ephemerides:
      type: chebyshev
      directory: "{kernelDir}"
      # The kernels provide the reference trajectory, the initial state and
      # the perturbing-body positions.
      lunarRelativisticScaleConvention: tdbCompatibleLunarSurface
      longitudeLibrationCorrection: none
    # Earth dynamics frame: de440 or de430.
    earthDynamicsFrame: de440
    # Initial epoch as a two-part TDB Julian date (jd1 + jd2); 2451545.0 = J2000.
    initialTdbJd1: 2451545.0
    initialTdbJd2: 0.0
    # Integration span in seconds; negative values integrate backwards.
    durationSeconds: "{durationSeconds}"
    inputFileMassCatalog: ../data/auxiliary/de440_sb441_mass_catalog.txt
    externalBodyGroups: "{externalBodyGroups}"
    # Perturbing bodies: groups from the mass catalog plus individual body IDs.
    externalBodyIds: []

    outputStepSeconds: "{outputStepSeconds}"
    # Sampling of the per-force-group acceleration diagnostics, seconds; must
    # be a multiple of stepSeconds (null disables the diagnostics).
    accelerationDiagnosticsStepSeconds: 86400.0
    includeEih: true
    # Force terms: point_mass, eih_1pn, solar_j2, figure_earth, figure_moon,
    # tide, lense_thirring, solar_radiation_pressure.
    bodyForceTerms: [point_mass, eih_1pn, solar_j2, figure_earth, figure_moon, tide, lense_thirring, solar_radiation_pressure]

    # Static spherical-harmonic fields (.gfc), truncated at maxDegree.
    gravityFields:
      earth:
        path: ../data/auxiliary/DE440_EARTH_STATIC.gfc
        allowMissingCoefficients: true  # zonal-only field; absent terms are zero
        maxDegree: 5
        name: DE440 Earth static field
      moon:
        path: ../data/auxiliary/DE440_MOON_STATIC.gfc
        allowMissingCoefficients: true  # sparse field; absent terms are zero
        maxDegree: 6
        name: DE440 Moon static field

    # J2(t) = J2 + linearPerYear * T + quadraticPerYear2 * T^2, with T in
    # Julian years from J2000 TDB. quadraticPerYear2 is JPL's J2ET2, the
    # coefficient of T^2 itself (no 1/2 factor).
    earthJ2TimeVariation:
      referenceJdTdb: 2451545.0
      linearPerYear: -5.900000000e-12
      quadraticPerYear2: 9.000000000e-13
    moonFigurePartners: [EARTH, SUN, MERCURY BARYCENTER, VENUS BARYCENTER, MARS BARYCENTER, JUPITER BARYCENTER, SATURN BARYCENTER]

    # DE440 lunar degree-2 time-variable gravity: undistorted J2, moment
    # ratios beta and gamma, Love number k2 and tidal delay (days).
    lunarDegree2Gravity:
      j2Undistorted: 2.0321436013500001e-4
      beta: 6.3122040737914229e-4
      gamma: 2.2778898477433167e-4
      loveK2: 0.02419
      # Unnormalized DE440 static C21/S21/S22 (Pavlov, Eq. 16).
      c21Static: 2.2779569194479859e-10
      s21Static: 1.3343450358392620e-9
      s22Static: 0.0
      tidalDelayDays: 0.14519388258636395
      radiusM: 1738000.0
      meanMotionRadS: 2.6616995e-6

    # Earth tides raised by tideRaisers: Love numbers k2m and orbital/rotational
    # time lags (days) per order m = 0, 1, 2.
    earthTide:
      tideRaisers: [MOON, SUN]
      k20: 0.335
      k21: 0.277
      k22: 0.283
      tauOrbDays: [0.077, -0.010, -0.20982243826832672]
      tauRotDays: [0.0, 0.011929122823877609, -0.0007423627529883070]
      earthRotationRateRadS: 7.29211514670698e-5
      earthRadiusM: 6378136.6

    # Solar oblateness J2 and solar radius (m).
    solarJ2: 2.1961391516529825e-7
    solarRadiusM: 696000000.0
    # Solar Lense-Thirring and solar radiation pressure on the Moon and the Earth;
    # moonEpsilon and earthEpsilon are the radiation-pressure coefficients.
    solarRelativistic:
      includeLenseThirring: true
      includeRadiationPressure: true
      moonEpsilon: 1.44e-13
      earthEpsilon: 2.0e-14

    # DE440 environment terms. GM_sun(t) = GM_ref * (1 + fractionalRatePerYear
    # * years since referenceJdTdb), DE440 GMSDOT; applied to all force inputs.
    solarGmVariation:
      fractionalRatePerYear: -9.0e-14
      referenceJdTdb: 2451545.0
    # Kuiper-belt ring (DE440 MA8201-MA8236): pointCount point masses of GM
    # pointGmM3S2 (m^3/s^2) each, on a circle of radiusAu in the J2000 ecliptic
    # (obliquity in arcsec); the first point is at longitude phaseDegrees at
    # referenceJdTdb.
    kuiperBeltRing:
      pointGmM3S2: 247688421840.00977
      radiusAu: 44.0
      pointCount: 36
      obliquityArcsec: 84381.448
      referenceJdTdb: 2440400.5
      phaseDegrees: 0.0

    # Fixed-step predictor-corrector integrator: step (s), order, number of
    # corrector passes and interpolation orders. startupStepSeconds is the
    # smaller step used while the integrator history is built.
    stepSeconds: "{stepSeconds}"
    integratorOrder: 13
    correctorIterations: 2
    historyInterpolationOrder: 13
    trajectoryInterpolationOrder: 13
    startupStepSeconds: "{startupStepSeconds}"

    # Orbit table (Earth, Moon, EMB and Moon-relative states plus RTN differences
    # from the reference ephemeris), acceleration diagnostics, and metadata.
    outputFileOrbit: "{outputDir}/lunar_orbit.dat"
    outputFileAccelerationDiagnostics: "{outputDir}/lunar_acceleration_diagnostics.dat"
    outputFileMetadata: "{outputDir}/lunar_orbit_metadata.txt"
