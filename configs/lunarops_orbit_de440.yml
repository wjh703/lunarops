# yaml-language-server: $schema=lunarops.schema.json
# Propagate the geocentric lunar orbit for ten years from J2000 with the DE440
# force model and the DE440 degree-2 lunar gravity (no integrated rotation),
# and compare the result with the DE440 reference ephemeris. The model is in
# base/dynamics_de440.yml.
#
# The orbit is written on the integration grid (outputStepSeconds) and the
# acceleration diagnostics are sampled daily, one acceleration per force group.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_de440.yml
# Run with 3 local worker processes (this process integrates, the workers
# supply ephemeris data for the integration epochs):
#   python -m lunarops run configs/lunarops_orbit_de440.yml --workers 3
extends: base/dynamics_de440.yml
variables:
  outputDir: ./output/orbit_de440
  initialTdbJd1: 2451545.0
  durationSeconds: 315360000.0  # 3650 days
  outputStepSeconds: 5400.0
  stepSeconds: 5400.0
  startupStepSeconds: 675.0
  lunarRotation: null
  outputFileRotation: null
  # DE440 lunar degree-2 time-variable gravity: undistorted J2, moment ratios
  # beta and gamma, Love number k2 and tidal delay (days).
  lunarDegree2Gravity:
    j2Undistorted: 2.0321436013500001e-4
    beta: 6.3122040737914229e-4
    gamma: 2.2778898477433167e-4
    loveK2: 0.02419
    # Unnormalized DE440 static C21/S21/S22 (Pavlov, Eq. 16).
    c21Static: 2.2779569194479859e-10
    s21Static: 1.3343450358392620e-9
    s22Static: 0.0
    tidalDelayDays: 0.14519388258636395
    radiusM: 1738000.0
    meanMotionRadS: 2.6616995e-6
