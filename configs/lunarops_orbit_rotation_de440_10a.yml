# yaml-language-server: $schema=lunarops.schema.json
# Integrate the coupled lunar orbit and rotation (mantle and fluid core) for
# ten Julian years from JD(TDB) 2440400.5, the DE440 integration start, with
# the full DE440 environment, and compare with the DE440 kernels. The model is
# in base/dynamics_de440.yml.
#
# Output is daily; the integrator is a 13th-order Adams-Bashforth-Moulton
# scheme with 2700 s steps. The mantle deforms with a delay and starts from a
# rigid seed arc.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_orbit_rotation_de440_10a.yml
# Run with 3 local worker processes (this process integrates, the workers
# supply ephemeris data for the integration epochs):
#   python -m lunarops run configs/lunarops_orbit_rotation_de440_10a.yml --workers 3
# Slurm scripts: jobs/rotation_de440_10a.sbatch (serial) and
# jobs/rotation_de440_10a_workers.sbatch (worker processes).
extends: base/dynamics_de440.yml
variables:
  outputDir: ./output/orbit_rotation_de440_10a
