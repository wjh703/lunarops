# yaml-language-server: $schema=lunarops.schema.json
# LLR parameter estimation with EPM2021; the plan is in base/parameter_estimation.yml.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_parameter_estimation_epm2021.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate normal points):
#   mpirun -n 32 python -m lunarops run configs/lunarops_parameter_estimation_epm2021.yml --mpi
extends: [base/parameter_estimation.yml, base/ephemeris_epm2021.yml]
variables:
  rangeBiasIntervals:
    # Intervals start from the INPOP21a station range-bias table (Fienga et
    # al. 2021, Table 8) and are revised where a step test of the night-mean
    # residuals of a bias-free solution (Baarda w-test with white plus
    # Gauss-Markov noise, sequential, Monte-Carlo critical values) located
    # the steps elsewhere with both EPM2021 and DE440:
    #   APOLLO     step at 2011-01-12 (not 2010-11-01); 2012-04-07 overlap removed.
    #   GRASSE     ruby and YAG intervals span their whole eras; the 1993 step
    #              is at 1992-09-19; 1996-12 to 1998-06 is one level (the
    #              1996-10 to 1996-12 gap belongs to it); infrared offset
    #              2023-05-10 to 2023-07-11; the two 5-day 2004/2005
    #              intervals were not significant and are dropped.
    #   MCDONALD   1972-1976 and 1981-1985 levels from the step test.
    #   MLRS2      1988 and 1990-1993 offsets (none in INPOP21a).
    #   MATERA     no step at 2016; the 2003-2015 interval is dropped.
    # HALEAKALA, MLRS1 and WETTZELL keep the INPOP21a intervals (too few
    # nights for the test). Names give [start, end] with the end inclusive;
    # endExclusive is the following day. Overlapping intervals add.
    - {station: APOLLO, start: 2006-04-07, endExclusive: 2011-01-12, name: APOLLO_20060407_20110111}
    - {station: APOLLO, start: 2007-12-15, endExclusive: 2008-07-01, name: APOLLO_20071215_20080630}
    - {station: APOLLO, start: 2008-09-20, endExclusive: 2009-06-21, name: APOLLO_20080920_20090620}
    - {station: APOLLO, start: 2011-01-12, endExclusive: 2012-04-07, name: APOLLO_20110112_20120406}
    - {station: APOLLO, start: 2012-04-07, endExclusive: 2013-09-03, name: APOLLO_20120407_20130902}
    - {station: GRASSE, start: 1984-01-01, endExclusive: 1987-01-01, name: GRASSE_19840101_19861231}
    - {station: GRASSE, start: 1987-01-01, endExclusive: 2006-01-01, name: GRASSE_19870101_20051231}
    - {station: GRASSE, start: 1992-09-19, endExclusive: 1996-12-01, name: GRASSE_19920919_19961130}
    - {station: GRASSE, start: 1996-12-01, endExclusive: 1998-06-25, name: GRASSE_19961201_19980624}
    - {station: GRASSE, start: 2009-11-01, endExclusive: 2014-01-02, name: GRASSE_20091101_20140101}
    - {station: GRASSE, start: 2023-05-10, endExclusive: 2023-07-12, name: GRASSE_20230510_20230711}
    - {station: HALEAKALA, start: 1984-11-01, endExclusive: 1990-09-02, name: HALEAKALA_19841101_19900901}
    - {station: HALEAKALA, start: 1984-11-01, endExclusive: 1986-04-02, name: HALEAKALA_19841101_19860401}
    - {station: HALEAKALA, start: 1986-04-02, endExclusive: 1987-07-31, name: HALEAKALA_19860402_19870730}
    - {station: HALEAKALA, start: 1987-07-31, endExclusive: 1987-08-15, name: HALEAKALA_19870731_19870814}
    - {station: HALEAKALA, start: 1985-06-09, endExclusive: 1985-06-11, name: HALEAKALA_19850609_19850610}
    - {station: HALEAKALA, start: 1987-11-10, endExclusive: 1988-02-19, name: HALEAKALA_19871110_19880218}
    - {station: HALEAKALA, start: 1989-01-28, endExclusive: 1989-01-30, name: HALEAKALA_19890128_19890129}
    - {station: HALEAKALA, start: 1989-08-23, endExclusive: 1989-08-25, name: HALEAKALA_19890823_19890824}
    - {station: HALEAKALA, start: 1990-02-06, endExclusive: 1990-09-02, name: HALEAKALA_19900206_19900901}
    - {station: MCDONALD, start: 1969-01-01, endExclusive: 1985-07-02, name: MCDONALD_19690101_19850701}
    - {station: MCDONALD, start: 1972-04-09, endExclusive: 1972-04-28, name: MCDONALD_19720409_19720427}
    - {station: MCDONALD, start: 1972-04-28, endExclusive: 1972-07-01, name: MCDONALD_19720428_19720630}
