# yaml-language-server: $schema=../lunarops.schema.json
# INPOP21a: a priori reflector coordinates and empirical libration terms.
variables:
  ephemeris: inpop21a
  # A priori reflector coordinates in the INPOP21a PA frame.
  reflectorCoordinates:
    - {key: APOLLO11, xyzM: [1591966.6407, 690699.4669, 21003.7578]}
    - {key: LUNOKHOD1, xyzM: [1114292.2303, -781298.4355, 1076058.6227]}
    - {key: APOLLO14, xyzM: [1652689.5625, -520997.5929, -109730.5181]}
    - {key: APOLLO15, xyzM: [1554678.3071, 98095.5262, 765005.2077]}
    - {key: LUNOKHOD2, xyzM: [1339363.3937, 801871.9437, 756358.6633]}
  # Empirical libration corrections: three tau (longitude) terms with
  # periods of 206, 365 and 1095 d, the INPOP21a model (Fienga et al.
  # 2021, Table 6).
  librationTerms:
    - {name: tau_2l-2D_206d, axis: tau, delaunay: {l: 2, D: -2}}
    - {name: tau_lp_365d, axis: tau, delaunay: {lp: 1}}
    - {name: tau_2F-2l_1095d, axis: tau, delaunay: {F: 2, l: -2}}
