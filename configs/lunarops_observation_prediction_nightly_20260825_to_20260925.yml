# Beijing-time LLR prediction for 31 nightly intervals.  The campaign starts
# on 2026-08-25 at 23:00 and ends after the 2026-09-24 night at 01:00 on
# 2026-09-25.  Individual nightly grids are retained and then merged.

variables:
  dataDir: ~/deploy_bundle/data
  outputDir: ./output
  utcOffsetHours: 8.0
  stepSeconds: 10.0

globals:
  ephemerides:
    type: calceph
    directory: "{dataDir}/kernels/inpop21a"
    lunarRelativisticScaleConvention: alreadyScaled
    longitudeLibrationCorrection: inpop21a
  earthRotation:
    type: file
    file: "{outputDir}/nightly_20260825_eop_merged.txt"
  troposphere: none
  relativity: none
  stationDisplacement:
    - type: iers2010SolidEarthTide
    - type: iers2010PoleTide
    - type: iers2010OceanPoleTide
      coefficientFile: "{dataDir}/auxiliary/opoleloadcoefcmcor.txt"
  reflectorDisplacement: lunarSolidTide

programs:
  - program: IersC04EarthOrientationParameter
    inputFileC04: "{dataDir}/auxiliary/eopc04.1962-now.txt"
    outputFileEarthOrientationParameter: "{outputDir}/nightly_20260825_eop_c04.txt"

  - program: IersRapidEarthOrientationParameter
    inputFileFinals2000A: "{dataDir}/auxiliary/finals2000A.all"
    outputFileEarthOrientationParameter: "{outputDir}/nightly_20260825_eop_rapid.txt"

  - program: EarthOrientationParameterMerge
    inputFileC04EarthOrientationParameter: "{outputDir}/nightly_20260825_eop_c04.txt"
    inputFileRapidEarthOrientationParameter: "{outputDir}/nightly_20260825_eop_rapid.txt"
    outputFileEarthOrientationParameter: "{outputDir}/nightly_20260825_eop_merged.txt"

  - program: StationCatalogCreate
    outputFileStationCatalog: "{outputDir}/nightly_20260825_stations.txt"
    stationCoordinates:
      - key: Urumqi
        longitudeDeg: 87.1666666667
        latitudeDeg: 43.4666666667
        heightM: 2080.0
        velocityMPerYear: [0.0, 0.0, 0.0]
        positionEpochUtc: "2020-01-01T00:00:00"

  - program: ReflectorCatalogCreate
    outputFileReflectorCatalog: "{outputDir}/nightly_20260825_reflectors.txt"
    reflectorCoordinates:
      - {key: APOLLO15, xyzM: [1554678.3071, 98095.5262, 765005.2077]}

  - &nightlyPrediction
    program: LlrObservationPrediction
    inputFileStationCatalog: "{outputDir}/nightly_20260825_stations.txt"
    inputFileReflectorCatalog: "{outputDir}/nightly_20260825_reflectors.txt"
    outputFilePrediction: "{outputDir}/nightly_20260825_prediction.txt"
    outputFileWindows: "{outputDir}/nightly_20260825_windows.txt"
    startTime: "2026-08-25T23:00:00"
    endTime: "2026-08-26T01:00:00"
    utcOffsetHours: "{utcOffsetHours}"
    stepSeconds: "{stepSeconds}"
    mpi:
      chunksize: 16
    stationName: Urumqi
    reflectorName: APOLLO15
    minElevationDeg: 10.0
    minReflectorElevationDeg: 10.0
    maxSunElevationDeg: -6.0
    allowedElongationRangesDeg:
      - {startDeg: 30.0, endDeg: 160.0}
      - {startDeg: 200.0, endDeg: 330.0}
    showProgress: false

  - <<: *nightlyPrediction
    outputFilePrediction: "{outputDir}/nightly_20260826_prediction.txt"
    outputFileWindows: "{outputDir}/nightly_20260826_windows.txt"
    startTime: "2026-08-26T23:00:00"
    endTime: "2026-08-27T01:00:00"

  - <<: *nightlyPrediction
    outputFilePrediction: "{outputDir}/nightly_20260827_prediction.txt"
    outputFileWindows: "{outputDir}/nightly_20260827_windows.txt"
    startTime: "2026-08-27T23:00:00"
    endTime: "2026-08-28T01:00:00"

  - <<: *nightlyPrediction
