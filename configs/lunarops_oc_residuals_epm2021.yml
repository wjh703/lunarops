# Compute LLR O-C residuals with EPM2021 and reflector coordinates given
# in the EPM2021 lunar principal-axis frame.
#
# The run builds a merged Earth orientation file, converts TOTALOBS6924.DAT
# (MINI format) to the native normal-point format, writes the station and
# reflector catalogs, and evaluates every normal point. Each ephemeris
# variant of this file writes to its own outputDir.
#
# Run (serial):
#   python -m lunarops run configs/lunarops_oc_residuals_epm2021.yml
# Run with MPI (at least 2 ranks; rank 0 runs the programs, the other ranks
# evaluate normal points):
#   mpirun -n 16 python -m lunarops run configs/lunarops_oc_residuals_epm2021.yml --mpi
#
# Edit before running:
#   dataDir    directory holding kernels/epm2021, auxiliary/ and polac/
#   outputDir  directory for all products of this variant
#   NormalPointsConvert.inputFilesNormalPoints  the normal-point files to process
variables:
  dataDir: /data4/wangjinghuan/deploy_bundle/data
  outputDir: /data4/wangjinghuan/deploy_bundle/llrops_project_dev/output/llr_residuals_epm2021

shared:
  ephemerides:
    type: calceph
    directory: "{dataDir}/kernels/epm2021"
    # The lunar coordinates are used in their native relativistic scale
    # (alreadyScaled); DE kernels use tdbCompatibleLunarSurface.
    lunarRelativisticScaleConvention: alreadyScaled
    # Longitude-libration correction in the lunar PA -> LCRS orientation:
    # none or inpop21a.
    longitudeLibrationCorrection: none
  earthRotation:
    type: file
    file: "{outputDir}/eop_merged.txt"
observationModel:
  # Tropospheric delay (mendesPavlis or none), Shapiro delay (iersShapiro
  # or none) and IERS Conventions 2010 station displacements.
  troposphere: {type: mendesPavlis}
  relativity: {type: iersShapiro}
  stationDisplacement:
    - type: iers2010SolidEarthTide
    - type: iers2010PoleTide
    - type: iers2010OceanPoleTide
      coefficientFile: "{dataDir}/auxiliary/opoleloadcoefcmcor.txt"
    - type: iers2010OceanTidalLoading
      coefficientFile: "{dataDir}/auxiliary/fes2022b.txt"
      model: FES2022b
  reflectorDisplacement: {type: lunarSolidTide}
  # Additive station range biases from the built-in INPOP21a table. Use
  # type: none for uncorrected O-C, or type: table for user-supplied biases.
  rangeBias:
    type: inpop21a

programs:
  - program: IersC04EarthOrientationParameter
    inputFileC04: "{dataDir}/auxiliary/eopc04.1962-now.txt"
    outputFileEarthOrientationParameter: "{outputDir}/eop_c04.txt"
  - program: IersRapidEarthOrientationParameter
    inputFileFinals2000A: "{dataDir}/auxiliary/finals2000A.all"
    outputFileEarthOrientationParameter: "{outputDir}/eop_rapid.txt"
  - program: EarthOrientationParameterMerge
    inputFileC04EarthOrientationParameter: "{outputDir}/eop_c04.txt"
    inputFileRapidEarthOrientationParameter: "{outputDir}/eop_rapid.txt"
    outputFileEarthOrientationParameter: "{outputDir}/eop_merged.txt"
  # Convert the MINI input to the native normal-point file read by LlrResiduals.
  - program: NormalPointsConvert
    inputFilesNormalPoints:
      - "{dataDir}/polac/TOTALOBS6924.DAT"
    datasetName: totalobs6924
    # Unit of the MINI temperature field: deciCelsius or deciKelvin.
    miniTemperatureUnit: deciCelsius
    # CRD sigma source (CRD inputs only): binRmsAsSigma or fixed.
    crdUncertaintyPolicy: binRmsAsSigma
    outputFileNormalPoints: "{outputDir}/normal_points.txt"
    outputFileImportReport: "{outputDir}/normal_point_import_report.txt"
  # Station ITRF positions (m) and velocities (m/yr) at positionEpochUtc.
  - program: StationCatalogCreate
    outputFileStationCatalog: "{outputDir}/stations_epm2021.txt"
    stationCoordinates:
      - {key: APOLLO, xyzM: [-1463998.9079, -5166632.7663, 3435012.8921], velocityMPerYear: [-0.0139, -0.0003, -0.0023], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: GRASSE, xyzM: [4581692.1686, 556196.0742, 4389355.1225], velocityMPerYear: [-0.0151, 0.0193, 0.0114], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: HALEAKALA, xyzM: [-5466003.7272, -2404425.9189, 2242197.8916], velocityMPerYear: [-0.0122, 0.0622, 0.0310], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MATERA, xyzM: [4641978.8100, 1393067.5310, 4133249.4800], velocityMPerYear: [-0.0180, 0.0192, 0.0140], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MCDONALD, xyzM: [-1330781.6134, -5328756.4702, 3235697.8262], velocityMPerYear: [-0.0244, -0.0319, 0.0091], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS1, xyzM: [-1330121.0057, -5328532.3595, 3236146.0225], velocityMPerYear: [-0.0124, 0.0009, -0.0053], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: MLRS2, xyzM: [-1330021.4931, -5328403.3401, 3236481.6472], velocityMPerYear: [-0.0121, 0.0015, -0.0036], positionEpochUtc: "2000-01-01T00:00:00"}
      - {key: WETTZELL, xyzM: [4075576.7721, 931785.5248, 4801583.5601], velocityMPerYear: [-0.0139, 0.0170, 0.0124], positionEpochUtc: "2000-01-01T00:00:00"}
  # Reflector positions in the EPM2021 lunar PA frame, metres.
  - program: ReflectorCatalogCreate
    outputFileReflectorCatalog: "{outputDir}/reflectors_epm2021.txt"
    reflectorCoordinates:
      - {key: APOLLO11, xyzM: [1591966.886, 690699.375, 21003.724]}
      - {key: LUNOKHOD1, xyzM: [1114292.435, -781298.499, 1076058.752]}
      - {key: APOLLO14, xyzM: [1652689.750, -520997.630, -109730.551]}
      - {key: APOLLO15, xyzM: [1554678.538, 98095.437, 765005.260]}
      - {key: LUNOKHOD2, xyzM: [1339363.664, 801871.830, 756358.691]}
  - program: LlrResiduals
    inputFilesNormalPoints: ["{outputDir}/normal_points.txt"]
    inputFileStationCatalog: "{outputDir}/stations_epm2021.txt"
    inputFileReflectorCatalog: "{outputDir}/reflectors_epm2021.txt"
    # No time bounds: process all imported normal points.
    startTime: null
    endTime: null
    # standard = compact O-C table; full = all model and input diagnostics.
    outputLevel: standard
    minElevationDeg: 0.0
    showProgress: true
    # MPI only: normal points per task sent to a worker rank.
    mpi:
      chunksize: 32
    outputFileObservationResults: "{outputDir}/oc_residuals_epm2021.txt"
