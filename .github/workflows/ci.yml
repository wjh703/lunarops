name: CI

on:
  push:
  pull_request:

jobs:
  test-core-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Compile all sources
        run: python -m compileall -q lunarops scripts tests setup.py
      - name: Guard current data contracts
        run: python scripts/check_current_contract.py
      - name: Install core without SciPy
        run: uv sync --no-install-project --extra test --extra build
      - run: uv pip install --no-build-isolation --editable .
      - name: Core imports and format tests
        run: uv run pytest tests/test_epoch.py tests/test_normal_point_io.py tests/test_normal_equation_solver.py tests/test_optional_dynamics_profile.py
  test-native-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile all Python sources before dependency installation
        run: python -m compileall -q lunarops scripts tests setup.py
      - name: Guard current data contracts
        run: python scripts/check_current_contract.py
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Sync test and build environments
        run: uv sync --no-install-project --extra test --extra build --extra dynamics
      - name: Install editable Cython extension
        run: uv pip install --no-build-isolation --editable .
      - name: Check public schemas and documented program examples
        run: uv run pytest tests/test_second_review_contracts.py
      - name: Run tests
        run: uv run pytest
      - name: Build distributions
        run: uv run -m build --sdist --wheel --outdir dist
      - name: Verify Cython distribution payload
        run: uv run python scripts/verify_distribution.py dist/*.tar.gz dist/*.whl
